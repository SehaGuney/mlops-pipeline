services:
  postgres:
    image: postgres:13
    env_file: .env
    volumes:
      - postgres_db:/var/lib/postgresql/data

  redis:
    image: redis:6

  webserver:
    image: apache/airflow:2.6.2
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./dags:/opt/airflow/dags
    ports:
      - "8082:8080"
    command: webserver

  scheduler:
    image: apache/airflow:2.6.2
    env_file: .env
    depends_on:
      - webserver
    volumes:
      - ./dags:/opt/airflow/dags
    command: scheduler

  worker:
    image: apache/airflow:2.6.2
    env_file: .env
    depends_on:
      - webserver
      - scheduler
    volumes:
      - ./dags:/opt/airflow/dags
    command: celery worker

volumes:
  postgres_db:
